<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>HDR Gain Map Tuner</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <input id="fileInput" class="file-input" type="file" accept="image/*" />
      <p id="imageMeta" class="visually-hidden">No image loaded</p>

      <section class="workspace">
        <section class="preview-panel" aria-label="Image preview">
          <canvas id="previewCanvas"></canvas>
          <button id="emptyState" class="empty-state" type="button">
            <strong>Open image</strong>
          </button>
        </section>

        <aside id="controlsPanel" class="controls-panel" aria-label="Adjustment controls">
          <div id="toolPanel" class="tool-panel">
            <div class="tool-header">
              <strong id="toolTitle">Look</strong>
              <button id="panelClose" class="icon-button" type="button" aria-label="Close controls">&times;</button>
            </div>

            <div class="tool-section menu-section" data-section="open">
              <button id="menuOpen" class="menu-action" type="button">Open image</button>
            </div>

            <div class="tool-section menu-section" data-section="clear">
              <button id="menuClear" class="menu-action danger" type="button" disabled>Clear image</button>
            </div>

            <div class="tool-section menu-section" data-section="size">
              <div class="control-row compact">
                <label for="exportSize">Size</label>
                <select id="exportSize">
                  <option value="full">Full size</option>
                  <option value="4096">4096 px max</option>
                  <option value="2048">2048 px max</option>
                  <option value="preview">Preview size</option>
                </select>
              </div>
            </div>

            <div class="tool-section menu-section" data-section="save">
              <div class="button-grid">
                <button id="exportUltra" type="button" disabled>Ultra HDR</button>
                <button id="exportJpeg" type="button" disabled>JPEG</button>
                <button id="exportGain" type="button" disabled>Gain</button>
              </div>
              <p id="statusLine" class="status-line">Ready</p>
            </div>

            <div class="tool-section active" data-section="look">
              <div class="control-row compact">
                <label for="presetSelect">Preset</label>
                <select id="presetSelect">
                  <option value="vibrant">Vibrant recovery</option>
                  <option value="holosomnia">Holosomnia</option>
                  <option value="instagram_safe">Instagram safe</option>
                  <option value="instagram_bright">Instagram bright</option>
                  <option value="instagram_blast">Instagram blast</option>
                  <option value="custom">Custom</option>
                </select>
              </div>

              <div class="segmented" role="group" aria-label="Preview mode">
                <button class="segment active" type="button" data-mode="hdr">HDR</button>
                <button class="segment" type="button" data-mode="sdr">SDR</button>
                <button class="segment" type="button" data-mode="gain">Gain</button>
              </div>
            </div>

            <div id="toneSliderStack" class="tool-section slider-stack" data-section="tone"></div>
            <div id="colorSliderStack" class="tool-section slider-stack" data-section="color"></div>
            <div id="hdrSliderStack" class="tool-section slider-stack" data-section="hdr"></div>
          </div>

          <nav class="tool-rail" aria-label="Adjustment tools">
            <button class="tool-button" type="button" data-tool="open" aria-label="Open image">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h16M12 4v11M7 10l5 5 5-5" />
              </svg>
            </button>
            <button class="tool-button active" type="button" data-tool="look" aria-label="Look">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v18M4 8h16M7 16h10" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="tone" aria-label="Tone">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="color" aria-label="Color">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3c4.4 0 8 3.1 8 7 0 2.9-2 5.3-4.8 6.4-.9.4-1.2 1.4-.7 2.2.6 1-.2 2.4-1.5 2.4H12a9 9 0 0 1 0-18Z" />
                <circle cx="8.5" cy="10" r="1" />
                <circle cx="12" cy="8" r="1" />
                <circle cx="15.5" cy="10.5" r="1" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="hdr" aria-label="HDR">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="size" aria-label="Export size">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="save" aria-label="Export">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12M7 10l5 5 5-5M5 20h14" />
              </svg>
            </button>
            <button class="tool-button" type="button" data-tool="clear" aria-label="Clear image">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3" />
              </svg>
            </button>
          </nav>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
